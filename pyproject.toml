[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdotoolbox"
version = "0.1.0"
description = "Multi-Disciplinary Optimization with Bayesian Frameworks"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Mohamed Ali Belhafnaoui", email = "mohamed-ali.belhafnaoui@etud.polymtl.ca" },
]
dependencies = [
    "numpy",
    "scipy",
    "smt",
    "joblib",
    "numba",
    "matplotlib",
    "scikit-learn",
    "gpytorch",
    "torch",
    "jaxtyping",
    "typeguard",
    "pandas",
    "openmdao",
    "openaerostruct",
    "pymc",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[tool.hatch.build.targets.wheel]
packages = ["src/mdotoolbox"]

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals"]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:smt",
    "ignore::UserWarning:smt",
    "ignore::RuntimeWarning:smt",
    "ignore::DeprecationWarning:scipy",
    "ignore::scipy.optimize.OptimizeWarning",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:linear_operator.*",
    "ignore::DeprecationWarning:gpytorch.*",
    "ignore::FutureWarning:arviz",
    "ignore::FutureWarning:pymc",
]
markers = [
    "slow: tests that run a full BACO iteration or train a real GP (deselect with '-m \"not slow\"')",
]
